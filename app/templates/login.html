<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaterPrize Admin — Вход</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
<div class="login-card">
    <div class="logo">💧</div>
    <h1>WaterPrize</h1>
    <p class="sub">Панель управления</p>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form id="loginForm" method="POST" action="/admin/login">
        <div class="form-group">
            <label>Telegram ID</label>
            <input type="number" name="telegram_id" id="telegramIdInput" class="form-input" placeholder="Ваш Telegram ID" required>
        </div>
        <button type="submit" class="btn">Войти</button>
    </form>
    <div class="hint">Введите ваш Telegram ID, указанный при регистрации</div>
    <div id="autoStatus" class="loading" style="display:none;">⏳ Автоматический вход...</div>
</div>
<script src="/js/login.js"></script>
</body>
</html>
