<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaterPrize Admin — Вход</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0B0F19; color: #F9FAFB; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
        .login-card { background: #1F2937; border: 1px solid #374151; border-radius: 16px; padding: 40px 32px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        .logo { width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(135deg, #3B82F6, #06B6D4); display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto 16px; }
        h1 { font-size: 24px; font-weight: 800; margin-bottom: 4px; background: linear-gradient(135deg, #3B82F6, #06B6D4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .sub { color: #6B7280; font-size: 14px; margin-bottom: 28px; }
        .form-group { text-align: left; margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: #9CA3AF; margin-bottom: 6px; }
        .form-input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #374151; background: #0B0F19; color: #F9FAFB; font-size: 15px; font-family: inherit; outline: none; transition: border-color 150ms; }
        .form-input:focus { border-color: #3B82F6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        .form-input::placeholder { color: #6B7280; }
        .btn { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #3B82F6; color: #fff; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; transition: background 150ms; }
        .btn:hover { background: #2563EB; }
        .btn:active { transform: scale(0.98); }
        .error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); color: #EF4444; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px; font-size: 13px; }
        .hint { margin-top: 16px; font-size: 12px; color: #6B7280; }
        .loading { margin-top: 16px; font-size: 13px; color: #F59E0B; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="logo">💧</div>
    <h1>WaterPrize</h1>
    <p class="sub">Панель управления</p>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form id="loginForm" method="POST" action="/admin/login">
        <div class="form-group">
            <label>Telegram ID</label>
            <input type="number" name="telegram_id" id="telegramIdInput" class="form-input" placeholder="Ваш Telegram ID" required>
        </div>
        <button type="submit" class="btn">Войти</button>
    </form>
    <div class="hint">Введите ваш Telegram ID, указанный при регистрации</div>
    <div id="autoStatus" class="loading" style="display:none;">⏳ Автоматический вход...</div>
</div>
<script src="/js/login.js"></script>
</body>
</html>
