<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Scanner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <link rel="stylesheet" href="/css/scanner.css">
</head>
<body>
<div class="icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="url(#ig-scanner)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="ig-scanner" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#26C6DA"/><stop offset="1" stop-color="#00ACC1"/></linearGradient></defs><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></div>
<h1>Сканер QR-кодов</h1>
<p>Нажмите кнопку, наведите камеру на QR-код</p>
<button id="scanBtn" onclick="startScan()">Открыть сканер</button>
<div id="reader"></div>
<div id="result"></div>

<script src="/js/scanner.js"></script>
</body>
</html>
